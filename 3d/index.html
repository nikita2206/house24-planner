<!doctype html><html><head><meta charset="utf-8"><title>House 24 – 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;overflow:hidden;font:14px sans-serif}#ui{position:absolute;top:8px;left:8px;background:#fffd;padding:8px;border-radius:6px;max-width:320px}
button{margin:2px}#hint{font-size:12px;color:#444;margin-top:4px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="ui"><b>House 24 – 3D model</b> <a href="../">2D planner</a><br>
Floors: <button data-f="0">Ground</button><button data-f="1">+ First</button><button data-f="2">All</button><br>
<button id="orbit">Orbit</button><button id="walk">Walk (WASD)</button><br>
Jump: <button id="jtk">Heat pump / under-stair cupboard</button><button id="jtl">Top of stair (1F)</button><button id="jtc">Technical room 1F</button>
<div id="hint">Orbit: drag/scroll. Walk: click view, WASD + mouse, Esc to exit. Eye 1.6 m, walls collide, stairs walkable. Orange = assumed.</div></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
const FF=2.9,r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xdde3ea);s.add(new THREE.HemisphereLight(0xffffff,0x888877,2.2));const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(-5,12,-4);s.add(d);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.05,200);cam.position.set(-6,10,16);
const orb=new OrbitControls(cam,r.domElement);orb.target.set(2.5,1,5);orb.update();const pl=new PointerLockControls(cam,document.body);
let mode='orbit',level=0;const meshes=[],solid=[];const rc=new THREE.Raycaster();const EYE=1.6,R0=0.25,STEP=0.4;
new GLTFLoader().load('house24.glb',g=>{s.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){const b=new THREE.Box3().setFromObject(o);o.userData.f=b.min.y>=2*FF-0.35?2:b.min.y>=FF-0.35?1:0;o.material.side=THREE.DoubleSide;o.material.side=THREE.DoubleSide;meshes.push(o);if(!/^(Text|LBL|Label)/.test(o.name)&&!/glass/i.test(o.name))solid.push(o)}});setLevel(2);console.log('loaded',meshes.length);if(location.search.includes('test'))runTest()},undefined,e=>console.error(e));
function setLevel(l){level=l;meshes.forEach(m=>m.visible=m.userData.f<=l)}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.f));
function hit(o,d,far){rc.set(o,d);rc.far=far;const h=rc.intersectObjects(solid.filter(m=>m.visible),false);return h.length?h[0].distance:Infinity}
const DOWN=new THREE.Vector3(0,-1,0),UP=new THREE.Vector3(0,1,0);
function ground(p){const o=p.clone();o.y=p.y-EYE+STEP;const d=hit(o,DOWN,5);return d<5?o.y-d:null}
function tryMove(p,dx,dz){const len=Math.hypot(dx,dz);if(!len)return {p,blocked:false};const dir=new THREE.Vector3(dx/len,0,dz/len);
 const feet=p.y-EYE;for(const h of [STEP+0.05,0.9,EYE+0.1]){const o=p.clone();o.y=feet+h;if(hit(o,dir,len+R0)<len+R0)return {p,blocked:true,at:h}}
 const n=p.clone();n.x+=dx;n.z+=dz;const g=ground(n);if(g===null||feet-g>0.45)return {p,blocked:true,at:'drop'};n.y=g+EYE;return {p:n,blocked:false}}
function headroom(p){const o=p.clone();o.y=p.y-EYE+0.05;return hit(o,UP,10)+0.05}
window.runTest=function(){fetch('stairpath.json').then(r=>r.json()).then(sp=>{setLevel(2);
 const up=[[3.3,0,4.72],[3.6,0,4.72],...sp,[3.3,FF,5.72],[3.0,FF,5.5]];
 for(const [name,path] of [['up',up],['down',[...up].reverse()]]){let p=new THREE.Vector3(path[0][0],path[0][1]+EYE,path[0][2]);let minH=99,blocked=null;
  for(let i=1;i<path.length;i++){const t=new THREE.Vector3(path[i][0],0,path[i][2]);for(let k=0;k<200;k++){const dx=t.x-p.x,dz=t.z-p.z,L=Math.hypot(dx,dz);if(L<0.02)break;const s=Math.min(0.05,L);const r=tryMove(p,dx/L*s,dz/L*s);if(r.blocked){blocked=blocked||{seg:i,at:r.at,pos:p.toArray().map(v=>+v.toFixed(2))};break}p=r.p;{const hh=headroom(p);if(hh<minH){minH=hh;window._mh=p.toArray().map(v=>+v.toFixed(2))}}}}
  console.log('TEST',name,'end',p.toArray().map(v=>+v.toFixed(2)).join(','),'minHeadroom',minH.toFixed(2),'blocked',JSON.stringify(blocked),'minAt',JSON.stringify(window._mh))}})}
function walk(p,t){mode='walk';orb.enabled=false;cam.position.set(...p);cam.lookAt(...t);}
document.getElementById('orbit').onclick=()=>{mode='orbit';orb.enabled=true;pl.unlock();cam.position.set(-6,10,16);orb.target.set(2.5,1,5);orb.update()};
document.getElementById('walk').onclick=()=>walk([1.6,1.6,8.5],[1.6,1.6,4]);
document.getElementById('jtk').onclick=()=>{setLevel(0);walk([2.7,1.6,5.75],[4.6,1.2,5.65])};
document.getElementById('jtl').onclick=()=>{setLevel(1);walk([2.95,FF+1.6,5.72],[4.8,FF+0.2,5.6])};
document.getElementById('jtc').onclick=()=>{setLevel(1);walk([3.3,FF+1.6,6.78],[5,FF+1.3,6.78])};
r.domElement.onclick=()=>{if(mode==='walk')pl.lock()};
const k={};onkeydown=e=>k[e.code]=1;onkeyup=e=>k[e.code]=0;
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
const c=new THREE.Clock();r.setAnimationLoop(()=>{const dt=c.getDelta(),v=1.4*dt;if(mode==='walk'){const f=new THREE.Vector3();cam.getWorldDirection(f);f.y=0;f.normalize();const rt=new THREE.Vector3(-f.z,0,f.x);let mx=0,mz=0;const a=(k.KeyW?1:0)-(k.KeyS?1:0),b=(k.KeyD?1:0)-(k.KeyA?1:0);mx=(f.x*a+rt.x*b)*v;mz=(f.z*a+rt.z*b)*v;if(mx||mz){const r=tryMove(cam.position.clone(),mx,mz);cam.position.copy(r.p)}}r.render(s,cam)});
</script></body></html>
