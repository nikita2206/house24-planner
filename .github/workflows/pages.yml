name: Deploy planner to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/screenshots
          python3 src/build.py _site
          cp src/plan.js _site/plan.js
          for f in screenshots/*.png.b64; do base64 -d "$f" > "_site/screenshots/$(basename "$f" .b64)"; done
          touch _site/.nojekyll
          ls -la _site _site/screenshots
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
