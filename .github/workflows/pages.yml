name: Publish planner to gh-pages
# GitHub Pages serves the gh-pages branch. Every push to main rebuilds the site from src/ and
# replaces gh-pages with the result (index.html with config inlined, plan.js, decoded screenshots).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/screenshots
          python3 src/build.py _site
          cp src/plan.js _site/plan.js
          cp README.md _site/README.md
          for f in screenshots/*.png.b64; do base64 -d "$f" > "_site/screenshots/$(basename "$f" .b64)"; done
          touch _site/.nojekyll
          ls -la _site _site/screenshots
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
